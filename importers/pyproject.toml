[project]
name = "iol-property-importers"
version = "0.1.0"
description = "Seed-data importers for iol-property-plus (Property24 canonical suburb feed, South Africa only)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
p24-suburbs = "iol_importers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iol_importers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dbtest: touches a real PostgreSQL database; opt-in, needs TEST_DATABASE_URL",
]
addopts = "-m 'not dbtest'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
