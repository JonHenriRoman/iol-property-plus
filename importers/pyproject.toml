[project]
name = "iol-property-importers"
version = "0.1.0"
description = "Seed-data importers for iol-property-plus (Property24 canonical suburb feed, South Africa only)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
p24-suburbs = "iol_importers.cli:main"
iol-expire-listings = "iol_importers.lifecycle.cli:main"
propdata-import = "iol_importers.propdata.cli:main"
propctrl-import = "iol_importers.propctrl.cli:main"
remax-import = "iol_importers.remax.cli:main"
entegral-import = "iol_importers.entegral.cli:main"
propertyengine-import = "iol_importers.propertyengine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iol_importers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dbtest: touches a real PostgreSQL database; opt-in, needs TEST_DATABASE_URL",
    "live: calls a real external API; opt-in, needs credentials in .env.local",
]
addopts = "-m 'not dbtest and not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
